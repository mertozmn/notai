services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: notai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      POSTGRES_DB: notai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notai -d notai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: